plugins { id 'com.android.application' }
android {
    namespace 'com.irisai.autogoal'
    compileSdk 35
    defaultConfig {
        applicationId 'com.irisai.autogoal'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        release {
            if (System.getenv('IRIS_KEYSTORE')) {
                storeFile file(System.getenv('IRIS_KEYSTORE'))
                storePassword System.getenv('IRIS_STORE_PASSWORD')
                keyAlias 'iris-autogoal'
                keyPassword System.getenv('IRIS_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['onnx'] }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] } }
    testOptions { unitTests.returnDefaultValues = true; unitTests.all { systemProperty 'iris.assets', file('src/main/assets/vision').absolutePath } }
    lint { abortOnError true }
}
dependencies {
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.openpnp:opencv:4.9.0-0'
    // Host JNI only for recorded-frame integration tests, never packaged into APK.
    testRuntimeOnly 'com.microsoft.onnxruntime:onnxruntime:1.23.2'
}
