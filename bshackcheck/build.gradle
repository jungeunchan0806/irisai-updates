plugins { id 'com.android.application' }
android {
 namespace 'com.irisai.bshack.check'
 compileSdk 35
 defaultConfig { applicationId 'com.irisai.bshack.check'; minSdk 32; targetSdk 35; versionCode 1; versionName '1'; testInstrumentationRunner 'com.irisai.bshack.check.Checks' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('payload'), layout.buildDirectory.dir('farm-assets'), '../bridgecheck/fixtures', '../bridgecheck/generated']; jniLibs.srcDirs = ['src/main/jniLibs',layout.buildDirectory.dir('native'),layout.buildDirectory.dir('feature-native')] } }
 packagingOptions { jniLibs { useLegacyPackaging = true } }
}
tasks.register('copyDex', Copy) {
 dependsOn ':bshackui:assembleRelease'
 from {
  def baseline = providers.gradleProperty('irisBaselinePayload')
  baseline.isPresent() ? rootProject.file(baseline.get()) : zipTree(project(':bshackui').layout.buildDirectory.file('outputs/apk/release/bshackui-release-unsigned.apk').get().asFile)
 }
 include 'classes.dex'
 rename 'classes.dex', 'iris-panel.dex'
 into layout.buildDirectory.dir('payload')
}
tasks.register('copyBootstrap', Copy) {
 dependsOn 'copyDex'
 from layout.buildDirectory.file('payload/iris-panel.dex')
 rename 'iris-panel.dex', 'iris-bootstrap.dex'
 into layout.buildDirectory.dir('payload')
}
tasks.named('preBuild').configure { dependsOn 'copyDex' }
tasks.named('preBuild').configure { dependsOn 'copyBootstrap' }
tasks.register('copyFarmAssets', Copy) {
 dependsOn ':bshackui:assembleRelease'
 from(zipTree(project(':bshackui').layout.buildDirectory.file('outputs/apk/release/bshackui-release-unsigned.apk').get().asFile)) {
  include 'assets/iris_farm/**'
  eachFile { path = path.substring('assets/'.length()) }
  includeEmptyDirs = false
 }
 from('../irisfarm/src/test/resources') { include 'frames/**' }
 into layout.buildDirectory.dir('farm-assets')
}
tasks.register('copyFarmLibraries', Copy) {
 dependsOn ':bshackui:assembleRelease'
 from(zipTree(project(':bshackui').layout.buildDirectory.file('outputs/apk/release/bshackui-release-unsigned.apk').get().asFile)) {
  include 'lib/x86_64/**'
  eachFile { path = path.substring('lib/'.length()) }
  includeEmptyDirs = false
 }
 into layout.buildDirectory.dir('native')
}
tasks.named('preBuild').configure { dependsOn 'copyFarmAssets','copyFarmLibraries' }
