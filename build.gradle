plugins { id 'com.android.application' version '8.7.3' apply false }
subprojects {
    apply plugin: 'com.android.application'
    android {
        compileSdk 35
        defaultConfig {
            minSdk 32
            targetSdk 35
            versionCode 4
            versionName '2.0.0'
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
        sourceSets.main.java.srcDir rootProject.file('theseven-common/java')
        sourceSets.main.assets.srcDir rootProject.file('theseven-common/assets')
    }
}
