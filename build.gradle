plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'com.irisai.farm'
    compileSdk 35
    defaultConfig {
        applicationId 'com.irisai.externalplayer'
        minSdk 32
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { ndk { abiFilters 'arm64-v8a' } }
        debug { ndk { abiFilters 'arm64-v8a', 'x86_64' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['onnx'] }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/INDEX.LIST'] } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
    testImplementation 'org.openpnp:opencv:4.9.0-0'
    testRuntimeOnly 'com.microsoft.onnxruntime:onnxruntime:1.23.2'
}
