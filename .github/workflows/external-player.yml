name: Android 17 external player and high refresh display
on:
  push:
    branches: ['qa/android-external-player-api37']
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Verify the release and the locally built emulator inputs
        run: |
          sha256sum -c dist/SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/*.apk
          sha256sum -c --quiet qa/emulator-inputs/source-sha256.txt
          sha256sum -c qa/emulator-inputs/archive-sha256.txt
          tar -xzf qa/emulator-inputs/player-1.0.2-x86_64.tar.gz
          for test_apk in build/outputs/apk/debug/*.apk qa/{arena,probe}/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$test_apk"
          done
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.2'
          system-image-api-level: '37.2'
          pre-emulator-launch-script: bash qa/configure-display.sh
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_2
          emulator-build: '15261927'
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu software -memory 4096 -cores 4 -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator
          disk-size: 12288M
          disable-animations: true
          script: python3 qa/check_player.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: android-player-verification, path: "qa-results/\nbuild/test-results/testDebugUnitTest/", if-no-files-found: warn}
