name: Android 17 external player and high refresh display
on:
  push:
    branches: ['qa/android-external-player-api37']
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - name: Check the signed release and build the test applications
        run: |
          sha256sum -c dist/SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/*.apk
          ./gradlew --console=plain :testDebugUnitTest :assembleDebug :qa:arena:assembleDebug :qa:probe:assembleDebug
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.2'
          system-image-api-level: '37.2'
          pre-emulator-launch-script: sed -i '/^hw.lcd.vsync/d;$a hw.lcd.vsync=120' "$HOME/.android/avd/test.avd/config.ini"
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_2
          emulator-build: '15261927'
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu software -memory 3072 -cores 2 -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator
          disk-size: 12288M
          disable-animations: true
          script: python3 qa/check_player.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: android-player-verification, path: "qa-results/\nbuild/test-results/testDebugUnitTest/", if-no-files-found: warn}
