name: Android 9 to 17 installer and patch compatibility
on:
  push:
    branches: [android-compat-nov19]
    paths: ['tools/android-compat/**', '.github/workflows/android-release-matrix.yml']
  workflow_dispatch:
    inputs:
      apis:
        description: 'Comma-separated API levels (empty to check all)'
        type: string
        required: false
      native_arm:
        description: 'Use an ARM64 emulator on Apple silicon'
        type: boolean
        default: false
      api37_page_size:
        description: 'Page size of the Android 17 image'
        type: choice
        options: ['16k', '4k']
        default: '16k'
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Android versions
        id: platforms
        env:
          REQUESTED_APIS: ${{ inputs.apis }}
          NATIVE_ARM: ${{ inputs.native_arm }}
          API37_PAGE_SIZE: ${{ inputs.api37_page_size }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          request = os.environ.get('REQUESTED_APIS', '').strip()
          native_arm = os.environ.get('NATIVE_ARM', '').lower() == 'true'
          page_size = os.environ.get('API37_PAGE_SIZE') or '16k'
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              message = subprocess.check_output(['git', 'log', '-1', '--format=%B'], text=True)
              selection = re.search(r'^Compat-APIs: ([0-9, ]+)$', message, re.MULTILINE)
              request = selection[1] if selection else ''
              native_arm = 'Compat-ARM64: true' in message.splitlines()
              page = re.search(r'^Compat-17-page: (4k|16k)$', message, re.MULTILINE)
              if page:
                  page_size = page[1]
          apis = sorted({int(value) for value in request.split(',')}) if request else list(range(28, 38))
          if not all(api in range(28, 38) for api in apis):
              raise ValueError('Supported API levels are 28 through 37')
          if page_size not in ('4k','16k'):
              raise ValueError('Unsupported Android 17 page size')
          images_37 = {
              '4k': ('37.0', 'google_apis', 4096),
              '16k': ('37.2', 'google_apis_ps16k', 16384),
          }
          image_37, target_37, page_bytes = images_37[page_size]
          targets = {33: 'google_apis_playstore', 37: target_37}
          platforms = [
              dict(api=api, image=image_37 if api == 37 else str(api),
                   page_bytes=page_bytes if api == 37 else '',
                   target=targets.get(api, 'google_apis'),
                   runner='macos-15' if native_arm else 'ubuntu-24.04',
                   arch='arm64-v8a' if native_arm else 'x86_64',
                   gpu='software' if api == 37 else 'swiftshader_indirect') for api in apis
          ]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('platforms=' + json.dumps(platforms), file=output)
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platforms;android-35 build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - run: bash tools/android-compat/build.sh
      - uses: actions/upload-artifact@v4
        with: {name: offline-panel-fixture, path: /tmp/iris-platform-qa.apk, retention-days: 2}
  platform:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.build.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: offline-panel-fixture, path: /tmp}
      - if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - if: runner.os == 'macOS'
        uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools', log-accepted-android-sdk-licenses: false}
      - if: runner.os == 'Linux'
        run: sudo chmod 666 /dev/kvm
      - name: Check ARM64 emulator acceleration
        if: runner.os == 'macOS'
        run: |
          if [[ "$(sysctl -n kern.hv_support 2>/dev/null || echo 0)" != 1 ]]; then
            echo "::error::The ARM64 Android emulator requires Hypervisor.framework. This runner does not expose it."
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_API: ${{ matrix.api }}
          REQUIRED_NATIVE_ABI: ${{ matrix.arch == 'arm64-v8a' && 'arm64-v8a' || '' }}
          REQUIRED_INSTALL_ABI: ${{ (matrix.api == 33 || matrix.api == 37) && 'arm64-v8a' || '' }}
          EXPECTED_PAGE_SIZE: ${{ matrix.page_bytes }}
        with:
          api-level: ${{ matrix.image }}
          # The Android 13 Play ext4 image includes the official ARM64 native bridge.
          system-image-api-level: ${{ matrix.api == 33 && matrix.arch == 'x86_64' && '33-ext4' || matrix.image }}
          # Android 17's ranchu mapper requires host support for rcReadColorBufferDMA.
          # gfxstream advertises it when both GLDirectMem and the shared-slot allocator are enabled.
          emulator-build: ${{ matrix.api == 37 && runner.os == 'Linux' && '15261927' || '' }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          disk-size: ${{ matrix.api == 37 && '12288M' || '8192M' }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu ${{ matrix.gpu }} -memory 3072 -cores 2 ${{ matrix.api == 37 && runner.os == 'Linux' && '-feature GLDirectMem,HasSharedSlotsHostMemoryAllocator' || '' }}
          script: python3 tools/android-compat/check.py --display-cycles ${{ matrix.api == 36 && 12 || matrix.api == 37 && 5 || 1 }}
      - name: Capture host status after a failed emulator run
        if: failure() && runner.os == 'Linux'
        run: |
          mkdir -p compat-evidence
          df -h / /tmp > compat-evidence/host-disk.txt
          free -m > compat-evidence/host-memory.txt
          sudo dmesg | tail -n 150 > compat-evidence/host-kernel.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'results-api-${{ matrix.api }}', path: compat-evidence/, retention-days: 14, if-no-files-found: warn}
