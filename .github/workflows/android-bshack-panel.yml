name: Build BSHACK 2.2.0 and publish signed patch channel
on:
  push:
    branches: [android-bshack-panel6]
    paths: ['distribution/bshack-panel6/**', '.github/workflows/android-bshack-panel.yml']
permissions: {contents: read}
jobs:
  validate:
    uses: ./.github/workflows/android-bridgecheck.yml
    with: {endurance_minutes: 15}
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y xdelta3
      - name: Restore the exact signed game APK
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request,subprocess,os,zipfile
          from pathlib import Path
          m=json.loads(Path('distribution/bshack-panel6/manifest.json').read_text());root=Path(os.environ['RUNNER_TEMP'])
          urllib.request.urlretrieve(m['baseline_url'],root/'baseline.apk')
          def sha(p):
            with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          assert sha(root/'baseline.apk')==m['baseline_sha256']
          assert sha(Path('distribution/bshack-panel6/patch.xdelta'))==m['patch_sha256']
          subprocess.run(['xdelta3','-d','-s',str(root/'baseline.apk'),'distribution/bshack-panel6/patch.xdelta',str(root/m['filename'])],check=True)
          assert sha(root/m['filename'])==m['sha256']
          signature=subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/35.0.0/apksigner','verify','--min-sdk-version','24','--verbose','--print-certs',str(root/m['filename'])],text=True)
          assert m['signer_certificate_sha256'] in signature
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in signature
          assert 'Verified using v3 scheme (APK Signature Scheme v3): true' in signature
          with zipfile.ZipFile(root/m['filename']) as z:assert hashlib.sha256(z.read('assets/iris-panel.dex')).hexdigest()==m['ui_sha256']
          print(signature)
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/BSHACK-Autogoal-2.2.0.apk"
          python bshack/verify.py "$RUNNER_TEMP/baseline.apk" "$RUNNER_TEMP/BSHACK-Autogoal-2.2.0.apk"
      - name: Prepare panel signing handoff
        run: |
          python seller-panel/native-panels/build.py --sdk-tools "$ANDROID_HOME/build-tools/35.0.0" --out "$RUNNER_TEMP/prepared-panels" --prepare-only
          git archive --format=zip --output="$RUNNER_TEMP/BSHACK-Panel-Update-Sources-2.2.0.zip" HEAD seller-panel/native-panels seller-panel/native-admin seller-panel/seller-client seller-panel/public/downloads/admin-1.2.0 seller-panel/public/downloads/seller-2.0.0
          python - <<'PY'
          from pathlib import Path
          import os,zipfile
          root=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'BSHACK-Panel-Update-Sources-2.2.0.zip','a',compression=zipfile.ZIP_DEFLATED) as z:
            for p in (root/'prepared-panels').iterdir():z.write(p,'prepared-not-installable/'+p.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bshack-panel6-release
          path: |
            ${{ runner.temp }}/BSHACK-Autogoal-2.2.0.apk
            ${{ runner.temp }}/BSHACK-Autogoal-2.2.0.apk.sha256
            ${{ runner.temp }}/BSHACK-Autogoal-2.2.0.verification.json
            ${{ runner.temp }}/BSHACK-Panel-Update-Sources-2.2.0.zip
          compression-level: 0
          retention-days: 7
  publish:
    needs: [validate, package]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: bshack-panel6-release, path: apk}
      - name: Publish verified APK and signed small-patch channel
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          cp distribution/bshack-panel6/RELEASE-KO.md release-notes.md
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('release-notes.md');p.write_text(p.read_text()+'\n[Android 15·16 검사 및 각 15분 연속 검사](https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+')\n')
          Path('channel-notes.md').write_text('앱 자동 패치용 채널입니다. 직접 설치하는 파일이 아닙니다.\n\n설치 APK: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/tag/android-bshack-panel6\n')
          PY
          if ! gh release view android-bshack-panel6 >/dev/null 2>&1; then
            gh release create android-bshack-panel6 --target "$GITHUB_SHA" --title 'BSHACK 2.2.0 · HWID/UI 수정 · 앱 내부 패치' --notes-file release-notes.md --draft --prerelease --latest=false
          fi
          gh release upload android-bshack-panel6 apk/* distribution/bshack-panel6/BSHACK-patch-2.2.0.zip --clobber
          if ! gh release view android-bshack-updates >/dev/null 2>&1; then
            gh release create android-bshack-updates --target "$GITHUB_SHA" --title 'BSHACK 자동 패치 채널 · 설치 파일 아님' --notes-file channel-notes.md --draft --prerelease --latest=false
          fi
          gh release upload android-bshack-updates distribution/bshack-panel6/stable.json.sig --clobber
          gh release upload android-bshack-updates distribution/bshack-panel6/stable.json --clobber
          gh release edit android-bshack-updates --notes-file channel-notes.md --draft=false --prerelease --latest=false
          gh release edit android-bshack-panel6 --notes-file release-notes.md --draft=false --prerelease --latest=false
