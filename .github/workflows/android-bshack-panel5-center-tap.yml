name: Verify and publish top-center menu opener
on:
  push:
    branches: [android-bshack-panel5-center-tap-build]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: distribution/bshack-panel5-center-tap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xdelta3
          gh release download android-bshack-panel5 --pattern BSHACK-Autogoal-2.1.1.apk --output original.apk
          echo '28b2cb0df2145613348432e0cc29c2b745b1ace21d638e8cd0158baed667d110  original.apk' | sha256sum --check
          xdelta3 -d -s original.apk panel.xdelta BSHACK-Autogoal-2.1.1-center-tap.apk
          sha256sum --check apk.sha256
          rm original.apk
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build touch-test fixture with the release UI
        run: |
          mkdir -p bshackcheck/build/payload
          unzip -p distribution/bshack-panel5-center-tap/BSHACK-Autogoal-2.1.1-center-tap.apk assets/iris-panel.dex > bshackcheck/build/payload/iris-panel.dex
          ./gradlew :bshackcheck:assembleDebug :bshackcheck:assembleDebugAndroidTest -x :bshackcheck:copyDex --max-workers=2 --console=plain
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2
          script: python bshack/ci_payload.py
      - name: Publish verified APK
        working-directory: distribution/bshack-panel5-center-tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-bshack-panel5-center-tap BSHACK-Autogoal-2.1.1-center-tap.apk --target "$GITHUB_SHA" --title 'BSHACK 2.1.1 · 상단 중앙 투명 버튼' --notes '게임 화면 상단 중앙의 투명 버튼을 누르면 큰 설정 창이 열립니다. Android 에뮬레이터에서 상단 중앙 터치로 창이 열리는지 확인했습니다.' --prerelease --latest=false
