name: Verify real Frida Android UI bridge
on:
  workflow_dispatch:
    inputs:
      endurance_minutes: {type: number, default: 0}
      release_manifest: {type: string, default: 'distribution/bshack-panel7/manifest.json'}
      recovery_patch: {type: string, default: ''}
  workflow_call:
    inputs:
      endurance_minutes: {type: number, default: 0}
      release_manifest: {type: string, default: 'distribution/bshack-panel7/manifest.json'}
      recovery_patch: {type: string, default: ''}
permissions: {contents: read}
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {api: [35, 36]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - run: |
          pip install frida==17.5.1
          curl --fail --location --retry 3 -o /tmp/frida.xz https://github.com/frida/frida/releases/download/17.5.1/frida-gadget-17.5.1-android-x86_64.so.xz
          xz -d /tmp/frida.xz
          mkdir -p bshackcheck/src/main/jniLibs/x86_64
          cp /tmp/frida bshackcheck/src/main/jniLibs/x86_64/libirisgadget.so
          echo '{"interaction":{"type":"listen","address":"127.0.0.1","port":27042,"on_load":"resume"}}' > bshackcheck/src/main/jniLibs/x86_64/libirisgadget.config.so
          sudo chmod 666 /dev/kvm
      - env:
          RELEASE_MANIFEST: '${{ inputs.release_manifest }}'
        run: |
          python bridgecheck/prepare.py
          node --test bshack/runtime.test.mjs
          ./gradlew :controlui:testDebugUnitTest :irisfarm:testDebugUnitTest :bshackcheck:assembleDebug :bshackcheck:assembleDebugAndroidTest --console=plain --max-workers=2
          python - <<'PY'
          import zipfile,hashlib,json,os
          from pathlib import Path
          p=Path(os.environ.get('RELEASE_MANIFEST') or 'distribution/bshack-panel6/manifest.json')
          if p.exists():
            with zipfile.ZipFile('bshackui/build/outputs/apk/release/bshackui-release-unsigned.apk') as z: digest=hashlib.sha256(z.read('classes.dex')).hexdigest()
            assert digest==json.loads(p.read_text())['ui_sha256'], 'Release UI DEX differs from source-built UI DEX'
            print('Exact release UI DEX matches the source-built UI')
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          RECOVERY_PATCH: '${{ inputs.recovery_patch }}'
        with:
          api-level: '${{ matrix.api }}'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2
          script: |
            python bshack/ci_payload.py
            ENDURANCE_MINUTES=${{ inputs.endurance_minutes || 0 }} python bridgecheck/check.py
            if [ -n "$RECOVERY_PATCH" ]; then python bridgecheck/prepare_recovery.py "$RECOVERY_PATCH" && ./gradlew :bshackcheck:assembleDebug -PirisBaselinePayload=bridgecheck/generated/recovery/baseline/classes.dex --console=plain --max-workers=2 && python bridgecheck/recovery_check.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-bridge-results-${{ matrix.api }}
          path: |
            bridgecheck-results/
            bshack-checks/
            recovery-checks/
