name: Verify real Frida Android UI bridge
on:
  push:
    branches: [android-bshack-panel6]
    paths: ['bridgecheck/**', 'bshack/**', 'bshackui/**', 'bshackcheck/**', 'controlui/**', '.github/workflows/android-bridgecheck.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - run: |
          pip install frida==17.5.1
          curl --fail --location --retry 3 -o /tmp/frida.xz https://github.com/frida/frida/releases/download/17.5.1/frida-gadget-17.5.1-android-x86_64.so.xz
          xz -d /tmp/frida.xz
          mkdir -p bshackcheck/src/main/jniLibs/x86_64
          cp /tmp/frida bshackcheck/src/main/jniLibs/x86_64/libirisgadget.so
          echo '{"interaction":{"type":"listen","address":"127.0.0.1","port":27042,"on_load":"resume"}}' > bshackcheck/src/main/jniLibs/x86_64/libirisgadget.config.so
          sudo chmod 666 /dev/kvm
      - run: |
          python bridgecheck/prepare.py
          node --test bshack/runtime.test.mjs
          ./gradlew :controlui:testDebugUnitTest :bshackcheck:assembleDebug :bshackcheck:assembleDebugAndroidTest --console=plain --max-workers=2
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2
          script: |
            python bshack/ci_payload.py
            python bridgecheck/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-bridge-results
          path: |
            bridgecheck-results/
            bshack-checks/
