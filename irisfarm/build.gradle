plugins { id 'com.android.library' }
android {
 namespace 'com.irisai.farm'
 compileSdk 35
 defaultConfig { minSdk 32; ndk { abiFilters 'arm64-v8a', 'x86_64' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main.java {
  srcDirs 'src/main/java', '../app/src/main/java'
  include 'com/irisai/farm/**', 'com/irisai/autogoal/Geometry.java', 'com/irisai/autogoal/YoloDetector.java'
 } }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation 'org.opencv:opencv:4.12.0'
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20250107'
 testImplementation 'org.openpnp:opencv:4.9.0-0'
 testRuntimeOnly 'com.microsoft.onnxruntime:onnxruntime:1.23.2'
}
